# Step 1 of 2: create the base environment (interpreter only).
#
#   conda env create -f environment.yml
#   conda activate palm
#   pip install -r requirements.txt
#   pip install -e . --no-deps
#
# The Python packages are installed separately with pip, in step 2, rather than
# from a pip: block here. On a cluster that matters: a failure in the pip phase
# of `conda env create` aborts the whole command and leaves a half-built
# environment, while a separate `pip install -r requirements.txt` can simply be
# re-run until it succeeds.
name: palm
channels:
  - conda-forge
dependencies:
  - python=3.10.15
  - pip

# Keep the environment from importing packages out of ~/.local. This is set on
# activation, so the pip step in the instructions above inherits it and installs
# every dependency into the environment instead of treating a copy in your home
# directory as already satisfied.
variables:
  PYTHONNOUSERSITE: "1"
