# Conda environment for running PALM.
#
#   conda env create -f environment.yml
#   conda activate palm
#   pip install -e . --no-deps
#
# This pins a CUDA build of PyTorch. For a CPU-only machine, drop the
# `pytorch-cuda` line and the `nvidia` channel, and add `cpuonly`.
# Adjust `pytorch-cuda` to match the CUDA version your driver supports.
name: palm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.1
  - pytorch-cuda=12.1
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - tqdm>=4.66
  - pip
  - pip:
      - transformers>=4.38
      - peft>=0.10
      - huggingface-hub>=0.20
