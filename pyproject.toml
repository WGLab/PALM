[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palm-protein"
version = "0.1.0"
description = "PALM overlap-aware residue annotation and variant-effect analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.38",
  "peft>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["palm*"]

[tool.ruff]
line-length = 100

